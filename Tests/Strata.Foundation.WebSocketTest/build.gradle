plugins {
    id 'java'
    id "com.github.davidmc24.gradle.plugin.avro-base" version "1.3.0"
}

sourceSets {
    test.java.srcDirs = ['test/java','build/generated-java']
    test.resources.srcDirs = ['test/resources','test/schema']
    main.java.srcDirs = ['unused']
    main.resources.srcDirs = ['unused']
}

import com.github.davidmc24.gradle.plugin.avro.GenerateAvroJavaTask

apply plugin: "java"
apply plugin: "com.github.davidmc24.gradle.plugin.avro-base"

configurations {
    avroSchema
}

dependencies {
    implementation "org.apache.avro:avro:1.11.0"
    avroSchema project(':Components:Strata.Foundation.Core')
}

def importAvroSchema = tasks.register('importAvroSchema', Copy) {
    dependsOn(':Components:Strata.Foundation.Core:jar')
    from {
        configurations.avroSchema.collect { it.isDirectory() ? it : zipTree(it) }
    }
    include "avro/*.avsc"
    into layout.buildDirectory.dir("imported-schema")
}

def genAvro = tasks.register("genAvro", GenerateAvroJavaTask) {
    source = [file("test/schema"),file("build/imported-schema")]
    outputDir = file("build/generated-java")
    createSetters = true
    createOptionalGetters = false
    gettersReturnOptional = false
    optionalGettersForNullableFieldsOnly = false
    fieldVisibility = "PRIVATE"
    outputCharacterEncoding = "UTF-8"
    stringType = "String"
    enableDecimalLogicalType = true
}

tasks.named("genAvro").configure {
    source(importAvroSchema)
}

tasks.named("compileJava").configure {
    source(genAvro)
}
tasks.register('testJar', Jar) {
    archiveClassifier = 'tests'
    from sourceSets.test.output

    from sourceSets.test.resources

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named("testJar").configure {
    dependsOn testClasses
    dependsOn genAvro
}

configurations {
    testArtifacts
}

artifacts {
    archives testJar
    testArtifacts testJar
}

dependencies {
    testImplementation(testFixtures(project(':Tests:Strata.Foundation.CoreTest')))
    testImplementation project(':Components:Strata.Foundation.WebSocket')
    testImplementation 'org.slf4j:slf4j-reload4j:2.0.17'
    testImplementation 'org.apache.logging.log4j:log4j-core:2.24.3'
    testImplementation "org.junit.jupiter:junit-jupiter:$junit_jupiter_version"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junit_jupiter_version"
}

test {
    useJUnitPlatform {
        includeTags("CommitStage")
    }
}