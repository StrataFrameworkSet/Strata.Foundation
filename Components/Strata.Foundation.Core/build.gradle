plugins {
    id 'java-library'
    id "com.github.davidmc24.gradle.plugin.avro-base" version "1.3.0"
}

sourceSets {
    main.java.srcDirs = ['main/java','build/generated-java']
    main.resources.srcDirs = ['main/resources','main/schema']
    test.java.srcDirs = ['unused']
    test.resources.srcDirs = ['unused']
}

import com.github.davidmc24.gradle.plugin.avro.GenerateAvroJavaTask

apply plugin: 'maven-publish'
apply plugin: "com.github.davidmc24.gradle.plugin.avro-base"

group 'strata.foundation'
version "$major$minor$patch"

def genAvro = tasks.register("genAvro", GenerateAvroJavaTask) {
    source = file("main/schema/avro")
    outputDir = file("build/generated-java")
    createSetters = true
    createOptionalGetters = false
    gettersReturnOptional = false
    optionalGettersForNullableFieldsOnly = false
    fieldVisibility = "PRIVATE"
    outputCharacterEncoding = "UTF-8"
    stringType = "String"
    enableDecimalLogicalType = true
}

tasks.named("compileJava").configure {
    source(genAvro)
}

java {
    withJavadocJar()
    withSourcesJar()
}

javadoc {
    options.addBooleanOption('Xdoclint:all,-missing', true)
}

publishing {
    publications {
        StrataFoundationCore(MavenPublication) {
            artifactId = 'strata-foundation-core'
            from components.java

            repositories {
                maven {
                    name "GitHubPackages"
                    url "https://maven.pkg.github.com/StrataFrameworkSet/repository"
                    credentials {
                        username = "$System.env.REPOSITORY_USER"
                        password = "$System.env.REPOSITORY_PASSWORD"
                    }
                }
            }
        }
    }
}

dependencies {
    //api "com.google.inject:guice:$guice_version"
    api "org.jasypt:jasypt:$jasypt_version"
    api "org.apache.avro:avro:$avro_version"
    api "com.fasterxml.jackson.datatype:jackson-datatype-jdk8:$jackson_version"
    api "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:$jackson_version"
    api "org.apache.logging.log4j:log4j-api:$log4j_version"
    api "jakarta.ws.rs:jakarta.ws.rs-api:$jakarta_ws_rs_version"
    api "jakarta.inject:jakarta.inject-api:$jakarta_inject_version"
    api "javax.money:money-api:$java_money_version"
    api "org.junit.platform:junit-platform-launcher:$junit_platform_version"

}
