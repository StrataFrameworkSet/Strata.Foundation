project.buildDir = ".build";
wrapper.jarFile = ".gradle/wrapper/gradle-wrapper.jar"


ext {
    spring_version = "6.2.2"
    springboot_version = "3.4.1"
    spring_guice_version = "3.0.0"
    spring_kafka_version = "3.3.1"
    springdoc_version = "2.8.4"

    guice_version = "7.0.0"
    jackson_version = "2.21.1"
    avro_version = "1.12.1"
    kafka_version = "3.8.0"
    chronicle_queue_version = "5.26ea9"
    hibernate_version = "6.4.4.Final"
    log4j_version = "2.25.3"
    jasypt_version = "1.9.3"

    confluent_kafka_version = "3.4.0"
    confluent_avro_version = "8.2.0"

    jakarta_inject_version = "2.0.1"
    jakarta_ws_rs_version = "4.0.0"
    jakarta_websocket_version = "2.3.0-M2"

    junit_jupiter_version = "5.13.3"
    junit_platform_version = "1.13.3"

    major = "1"
    minor = ".0"
    patch = "-SNAPSHOT"
}

group 'strata.foundation'
version "$major$minor$patch"
